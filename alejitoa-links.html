<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5f2" />
  <title>Alejito’a — links</title>
  <style>
    :root{
      --bg:#f7f5f2;
      --card:rgba(255,255,255,.78);
      --text:#111111;
      --muted:#77736f;
      --line:rgba(17,17,17,.08);
      --shadow:0 18px 55px rgba(30,25,20,.10);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
    body{
      min-height:100svh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:28px 18px calc(34px + env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 20% 0%, rgba(235,214,197,.72), transparent 34%),
        radial-gradient(circle at 100% 30%, rgba(206,221,228,.62), transparent 34%),
        linear-gradient(180deg,#fbfaf8 0%,#f4f1ed 100%);
    }
    .wrap{width:min(100%,430px)}
    .card{
      position:relative;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.75);
      background:var(--card);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-radius:34px;
      padding:34px 22px 24px;
      box-shadow:var(--shadow);
    }
    .shine{
      position:absolute;inset:-90px auto auto -80px;width:220px;height:220px;border-radius:50%;
      background:rgba(255,255,255,.72);filter:blur(6px);pointer-events:none
    }
    .avatar{
      width:92px;height:92px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
      background:linear-gradient(145deg,#111,#4a4743);color:white;font-family:Georgia,"Times New Roman",serif;
      font-size:38px;font-style:italic;letter-spacing:-2px;border:4px solid rgba(255,255,255,.95);
      box-shadow:0 12px 26px rgba(0,0,0,.14)
    }
    h1{margin:0;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:34px;font-style:italic;font-weight:600;letter-spacing:-.7px}
    .tag{margin:8px 0 5px;text-align:center;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
    .bio{margin:0 0 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
    .links{display:grid;gap:12px}
    a.btn{
      text-decoration:none;color:var(--text);display:flex;align-items:center;gap:13px;width:100%;padding:15px 16px;
      border-radius:18px;background:rgba(255,255,255,.86);border:1px solid var(--line);
      box-shadow:0 8px 20px rgba(30,25,20,.05);font-size:16px;font-weight:650;
      transition:transform .16s ease, box-shadow .16s ease, background .16s ease
    }
    a.btn:active{transform:scale(.985);background:#fff}
    .icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#111;color:#fff;flex:0 0 38px;font-size:18px;font-weight:800}
    .copy{min-width:0;flex:1}
    .name{display:block;font-size:16px;line-height:1.15}
    .sub{display:block;margin-top:3px;color:var(--muted);font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .arrow{font-size:20px;color:#8d8883}
    .footer{margin-top:22px;text-align:center;color:#8f8a85;font-size:12px;letter-spacing:.03em}
    .spark{font-size:15px}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="shine"></div>
      <div class="avatar">A’</div>
      <h1>Alejito’a</h1>
      <div class="tag">lifestyle &amp; travel <span class="spark">✦</span></div>
      <p class="bio">Life goes on ✨<br>Momentos · viajes · historias</p>

      <div class="links">
        <a class="btn" href="https://wa.me/573233978882?text=Hola%20Alejito%E2%80%99a%20%E2%9C%A8%20Vi%20tu%20perfil%20y%20quise%20saludarte%20%F0%9F%A4%8D" target="_blank" rel="noopener">
          <span class="icon">W</span>
          <span class="copy"><span class="name">WhatsApp</span><span class="sub">Escríbeme un mensaje</span></span>
          <span class="arrow">›</span>
        </a>

        <a class="btn" href="https://www.instagram.com/alejandrx_x19/" target="_blank" rel="noopener">
          <span class="icon">◎</span>
          <span class="copy"><span class="name">Instagram</span><span class="sub">@alejandrx_x19</span></span>
          <span class="arrow">›</span>
        </a>

        <a class="btn" href="https://www.tiktok.com/@alejandrx.x19" target="_blank" rel="noopener">
          <span class="icon">♪</span>
          <span class="copy"><span class="name">TikTok</span><span class="sub">@alejandrx.x19</span></span>
          <span class="arrow">›</span>
        </a>
      </div>

      <div class="footer">Bogotá, Colombia · collecting moments since forever ✈︎</div>
    </section>
  </main>
</body>
</html>
